# CI on every push and pull request: lint, validate the OpenAPI files, test each service
# against a real SQL Server with a 70% coverage gate, and build both Docker images.
# Images are pushed to ghcr.io (tagged with the commit SHA) only from main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [habits, streaks]
        include:
          - service: habits
            cov: "--cov=app --cov=service --cov=auth --cov=db"
          - service: streaks
            cov: "--cov=app --cov=service --cov=db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r services/${{ matrix.service }}/requirements.txt ruff==0.17.4 openapi-spec-validator==0.9.0

      - name: Lint
        run: ruff check --select E4,E7,E9,F services/${{ matrix.service }}

      - name: Validate the OpenAPI file
        run: openapi-spec-validator services/${{ matrix.service }}/openapi.yaml

      # The passwords are made up for this run and masked in the log, so no secret is stored.
      # CI only uses this throwaway container, never the Azure database.
      - name: Start SQL Server and create the test databases
        run: |
          SA_PW="Sa1$(openssl rand -hex 12)"
          APP_PW="Ap1$(openssl rand -hex 12)"
          echo "::add-mask::$SA_PW"
          echo "::add-mask::$APP_PW"
          echo "APP_PW=$APP_PW" >> "$GITHUB_ENV"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PW" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PW" -C -Q "SELECT 1" && break
            sleep 4
          done
          docker cp db sql:/tmp/db
          for script in init.sql init_test.sql; do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PW" -C -b \
              -i /tmp/db/$script -v HABITS_DB_PASSWORD="$APP_PW" STREAKS_DB_PASSWORD="$APP_PW"
          done

      - name: Test with the 70% coverage gate
        working-directory: services/${{ matrix.service }}
        run: |
          export TEST_DATABASE_URL="mssql://${{ matrix.service }}_user:${APP_PW}@localhost:1433/${{ matrix.service }}_test"
          python -m pytest tests -v ${{ matrix.cov }} --cov-report=term-missing --cov-fail-under=70

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [habits, streaks]
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every push and pull request builds
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/habit-buddy-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
