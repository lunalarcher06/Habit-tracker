# One SQL Server, two services, and the static UI.
#   docker compose up --build
# Passwords and the JWT secret come from .env.
name: habit-buddy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
    ports:
      - "1433:1433"                  
    volumes:
      - sqldata:/var/opt/mssql       
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./db:/db:ro
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      HABITS_DB_PASSWORD: ${HABITS_DB_PASSWORD:?set HABITS_DB_PASSWORD in .env}
      STREAKS_DB_PASSWORD: ${STREAKS_DB_PASSWORD:?set STREAKS_DB_PASSWORD in .env}
    command:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b
        -i /db/init.sql
        -v HABITS_DB_PASSWORD="$$HABITS_DB_PASSWORD" STREAKS_DB_PASSWORD="$$STREAKS_DB_PASSWORD"

  habits:
    build:
      context: ./services/habits
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "8001"
      DATABASE_URL: mssql://habits_user:${HABITS_DB_PASSWORD}@sqlserver:1433/habits
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      UI_ORIGIN: http://localhost:8080
    ports:
      - "8001:8001"

  streaks:
    build:
      context: ./services/streaks
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully   # not on habits: Streaks must start without it
    environment:
      PORT: "8002"
      DATABASE_URL: mssql://streaks_user:${STREAKS_DB_PASSWORD}@sqlserver:1433/streaks
      JWT_SECRET: ${JWT_SECRET}
      HABITS_URL: http://habits:8001
      UI_ORIGIN: http://localhost:8080
    ports:
      - "8002:8002"

  ui:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro

volumes:
  sqldata:
